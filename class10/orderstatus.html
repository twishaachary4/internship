<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function first(status,callback){
            console.log("Order Confirmed" + status)
            callback("pizza",function(){
                console.log("Order Delivered")
            })
        }
        first("Order no 123", function(status2,callback){
            console.log("Order is being prepared",status2)
            callback()
        })


    </script>
</body>
</html>
