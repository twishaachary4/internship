<!DOCTYPE html>
<html lang="en">
    <body>
        <script>
            console.log(Math.floor(5.7)) //5
            console.log(Math.ceil(5.7)) //6
            console.log(Math.round(5.7)) //6
            console.log(Math.round(5.4)) //5
            console.log(Math.random()) // A random number between 0 and 1
            console.log(Math.random() * 10) // A random number between 0 and 10
        </script>
    </body>
</html>
